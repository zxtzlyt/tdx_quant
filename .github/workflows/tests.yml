name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    # 通达信库面向 Windows; 离线组不需要客户端, 在线组(test_live /
    # test_guide_examples 的 live_only)探测不到 TQ 服务时自动跳过。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest coverage
      - run: python -m coverage run -m pytest -v
      - run: python -m coverage report --include='tdx_local/*' -m
